<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <header>
        <div>
        <h1 class="glitch" data-text="HESOYAM PIXEL">HESOYAM.PIXEL</h1>
        <span class="tag" id="tag">Catálogo público · Explora títulos</span>
        </div>
        <nav class="d-flex align-items-center gap-2 flex-wrap">
        <a class="btn" href="../index.html">Catálogo</a>
        </nav>
    </header>

  <div class="floor"></div>
  <canvas id="rain"></canvas>
    <div class="container">

        <div class="row d-flex justify-content-center align-items-center vh-100">

            <div class="col-md-8 col-lg-7">

                <div class="card shadow">

                    <div class="row g-0">

                        <!-- Imagen a la izquierda -->
                        <div class="col-md-6">

                            <img src="../img/login.png" class="img-fluid h-100 rounded-start" style="object-fit: cover;"
                                alt="Imagen de bienvenida">

                        </div>

                        <!-- Formulario a la derecha -->
                        <div class="col-md-6 d-flex justify-content-center align-items-center">

                            <div class="card-body p-4">

                                <h3 class="text-center mb-4 glitch">Iniciar sesión</h3>

                                <form id="formLogin">

                                    <div class="mb-3">
                                        <label for="user" class="form-label">Usuario</label>
                                        <input type="text" id="user" class="form-control"
                                            placeholder="Ingrese su usuario" required>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Contraseña</label>
                                        <input type="password" id="password" class="form-control"
                                            placeholder="Ingrese su contraseña" required>
                                    </div>

                                    <p id="mensaje" class="text-danger text-center"></p>

                                    <button type="submit" class="btn btn-primary w-100">
                                        Entrar
                                    </button>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/login.js"></script>

</body>

</html>

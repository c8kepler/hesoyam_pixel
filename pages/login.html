
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css">
</head>
<body>

    <div class="container">

        <div class="row d-flex justify-content-center align-items-center vh-100">

            <div class="col-md-6 col-lg-5">

                <div class="card shadow">

                    <div class="card-body p-4">

                        <h3 class="text-center mb-4">Iniciar sesión</h3>

                        <form id="formLogin">

                            <div class="mb-3">

                                <label for="user" class="form-label">Usuario</label>

                                <input type="text" id="user" class="form-control" placeholder="Ingrese su usuario" required>

                            </div>

                            <div class="mb-3">

                                <label for="password" class="form-label">Contraseña</label>

                                <input type="password" id="password" class="form-control" placeholder="Ingrese su contraseña" required>

                            </div>

                            <p id="mensaje" class="text-danger text-center"></p>

                            <button type="submit" class="btn btn-primary w-100">
                                Entrar
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>
</html>

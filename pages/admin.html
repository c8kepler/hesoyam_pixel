<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hesoyam Pixel · Panel de administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <script>
    window.tailwind = { config: { corePlugins: { preflight: false } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <script>
    if (localStorage.getItem("sesionActiva") !== "true") {
      location.replace("login.html?requiere=1");
    }
  </script>
</head>
<body>
  <div class="floor"></div>
  <canvas id="rain"></canvas>

  <header>
    <div>
      <h1 class="glitch" data-text="HESOYAM PIXEL">HESOYAM PIXEL</h1>
      <span class="tag" id="tag">Catálogo de videojuegos · Panel admin</span>
    </div>
    <nav class="items-center">
      <a class="btn" href="../index.html">Catálogo público</a>
      <button class="btn p" id="btn-modo-juego" type="button">Modo: Juego Retro</button>
      <button class="btn" id="btn-cerrar-sesion" type="button">Cerrar sesión</button>
    </nav>
  </header>

  <div class="stripes"></div>
  <div class="neon"></div>

  <main class="max-w-4xl mx-auto px-4 pb-16">
    <div class="card">
      <h2>Panel del administrador</h2>
      <p class="msg" id="msg" role="status">Presiona START para abrir el panel de gestión.</p>
      <div class="big" id="big">READY</div>
      <div class="row">
        <button class="btn p" id="btn-start" type="button">▶ Start</button>
      </div>
    </div>

    <section id="panel" hidden>
      <p class="msg" id="fmsg" role="alert"></p>

      <div class="card">
        <h2 id="titulo-formulario">Nuevo videojuego</h2>
        <form id="form-videojuego" novalidate>
          <input type="hidden" id="juego-id">

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label for="titulo">Título *</label>
              <input id="titulo" maxlength="60" placeholder="Ej.: Hollow Knight">
            </div>

            <div>
              <label for="genero">Género *</label>
              <input id="genero" maxlength="30" placeholder="Ej.: Metroidvania">
            </div>

            <div>
              <label for="plataforma">Plataforma *</label>
              <select id="plataforma">
                <option value="">Elige una plataforma</option>
                <option value="PC">PC</option>
                <option value="Consola">Consola</option>
                <option value="Móvil">Móvil</option>
                <option value="Arcade">Arcade</option>
              </select>
            </div>

            <div>
              <label for="imagen">Imagen (URL, opcional)</label>
              <input id="imagen" placeholder="https://...">
            </div>
          </div>

          <label for="descripcion">Descripción *</label>
          <textarea id="descripcion" rows="3" maxlength="300" placeholder="Describe brevemente el juego..."></textarea>

          <div class="row mt-4">
            <button class="btn p" id="btn-guardar" type="submit">Crear juego</button>
            <button class="btn" id="btn-cancelar" type="button" hidden>Cancelar edición</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="flex items-center justify-between gap-2 mb-3">
          <h2 class="m-0">Juegos registrados</h2>
          <span id="contador-juegos" class="text-sm font-bold">0 juegos</span>
        </div>
        <div id="tabla-videojuegos"></div>
      </div>
    </section>
  </main>

  <script src="../js/admin.js"></script>
</body>
</html>

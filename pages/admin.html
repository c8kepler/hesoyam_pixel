<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin | Hesoyam Pixel</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Barra de navegación -->
  <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
    <div class="flex items-center gap-3">
      <span class="bg-indigo-600 text-white font-bold px-2.5 py-1 rounded text-sm">ADMIN</span>
      <h1 class="text-xl font-bold text-white">Hesoyam Pixel — Catálogo de Videojuegos</h1>
    </div>

    <div class="flex items-center gap-3">
      <a href="../index.html"
        class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-4 py-2 rounded text-sm font-medium transition">
        Ver Catálogo Público
      </a>
      <button id="btn-cerrar-sesion" type="button"
        class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded text-sm font-medium transition">
        Cerrar Sesión
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-8">

    <!-- Formulario para Crear / Editar Videojuego -->
    <section class="bg-slate-900 p-6 rounded-xl border border-slate-800 shadow-lg">
      <h2 id="titulo-formulario" class="text-lg font-semibold text-indigo-400 mb-4">
        Registrar Nuevo Videojuego
      </h2>

      <form id="form-videojuego" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- ID oculto para modo edición -->
        <input type="hidden" id="juego-id">

        <div>
          <label for="titulo" class="block text-sm font-medium text-slate-300 mb-1">
            Título del videojuego *
          </label>
          <input type="text" id="titulo" placeholder="Ej. Grand Theft Auto: San Andreas"
            class="w-full p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label for="genero" class="block text-sm font-medium text-slate-300 mb-1">
            Género *
          </label>
          <input type="text" id="genero" placeholder="Ej. Acción / Mundo Abierto"
            class="w-full p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
        </div>

        <div>
          <label for="plataforma" class="block text-sm font-medium text-slate-300 mb-1">
            Plataforma *
          </label>
          <select id="plataforma"
            class="w-full p-2.5 rounded-lg bg-slate-950 border border-slate-700 text-white focus:border-indigo-500 focus:outline-none">
            <option value="">Selecciona una plataforma</option>
            <option value="PC">PC</option>
            <option value="PlayStation 5">PlayStation 5</option>
            <option value="Xbox Series

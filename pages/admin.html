<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hesoyam Pixel · Panel de administración</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/styles.css">

  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="floor"></div>
  <canvas id="rain"></canvas>

  <header>
    <div>
      <h1 class="glitch" data-text="HESOYAM PIXEL">HESOYAM.PIXEL</h1>
      <span class="tag" id="tag">Catálogo de videojuegos · Panel admin</span>
    </div>
    <nav class="d-flex align-items-center gap-2 flex-wrap">
      <a class="btn" href="../index.html">Catálogo público</a>
      <button class="btn" id="btn-cerrar-sesion" type="button">Cerrar sesión</button>
    </nav>
  </header>

  <main class="container px-3 pb-5" style="max-width: 896px;">
    <div class="card mt-5">
      <h2>Panel del administrador</h2>
      <p class="msg" id="msg" role="status">Panel de gestión listo.</p>
      <div class="big" id="big">READY</div>
      <div class="d-flex gap-2 flex-wrap">
      </div>
    </div>

    <section id="panel">
      <p class="msg" id="fmsg" role="alert"></p>

      <div class="card">
        <h2 id="titulo-formulario">Nuevo videojuego</h2>
        <form id="form-videojuego" novalidate>
          <input type="hidden" id="juego-id">

          <div class="row g-3 mb-3">
            <div class="col-12 col-md-6">
              <label for="titulo" class="form-label">Título *</label>
              <input id="titulo" class="form-control" maxlength="60" placeholder="Ej.: Hollow Knight">
            </div>

            <div class="col-12 col-md-6">
              <label for="genero" class="form-label">Género *</label>
              <input id="genero" class="form-control" maxlength="30" placeholder="Ej.: Metroidvania">
            </div>

            <div class="col-12 col-md-6">
              <label for="plataforma" class="form-label">Plataforma *</label>
              <select id="plataforma" class="form-select">
                <option value="">Elige una plataforma</option>
                <option value="PC">PC</option>
                <option value="Consola">Consola</option>
                <option value="Móvil">Móvil</option>
                <option value="Arcade">Arcade</option>
              </select>
            </div>

            <div class="col-12 col-md-6">
              <label for="imagen" class="form-label">Imagen (URL, opcional)</label>
              <input id="imagen" type="url" class="form-control" placeholder="https://...">
            </div>

            <!-- Nuevos inputs para Tutorial y Wiki -->
            <div class="col-12 col-md-6">
              <label for="tutorial" class="form-label">Tutorial YouTube (URL, opcional)</label>
              <input id="tutorial" type="url" class="form-control" placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <div class="col-12 col-md-6">
              <label for="wiki" class="form-label">Wiki del juego (URL, opcional)</label>
              <input id="wiki" type="url" class="form-control" placeholder="https://...fandom.com/wiki/...">
            </div>
          </div>

          <label for="descripcion" class="form-label">Descripción *</label>
          <textarea id="descripcion" class="form-control" rows="3" maxlength="300" placeholder="Describe brevemente el juego..."></textarea>

          <div class="d-flex gap-2 flex-wrap mt-4">
            <button class="btn p" id="btn-guardar" type="submit">Crear juego</button>
            <button class="btn d-none" id="btn-cancelar" type="button">Cancelar edición</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
          <h2 class="m-0">Juegos registrados</h2>
          <span id="contador-juegos" class="small fw-bold">0 juegos</span>
        </div>
        <div id="tabla-videojuegos"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/admin.js"></script>
</body>
</html>

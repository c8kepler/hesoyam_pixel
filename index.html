<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hesoyam Pixel · Catálogo de videojuegos</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="floor"></div>
  <canvas id="rain"></canvas>

  <header>
    <div>
      <h1 class="glitch" data-text="HESOYAM PIXEL">HESOYAM.PIXEL</h1>
      <span class="tag" id="tag">Catálogo público · Explora títulos</span>
    </div>
    <nav class="d-flex align-items-center gap-2 flex-wrap">
      <a class="btn" href="pages/login.html">Acceso Admin</a>
    </nav>
  </header>
  <main class="container px-3 pb-5" style="max-width: 1024px;">
    <!-- Banner de bienvenida -->
    <div class="card mb-4 mt-5">
      <h2>Explora el catálogo</h2>
      <p class="msg mb-2">Descubre nuestra selección de videojuegos. Haz clic en cualquier título para ver su ficha completa.</p>
      <div class="big">INSERT COIN</div>

      <!-- Barra de búsqueda y filtro rápido -->
      <div class="row g-2 mt-3">
        <div class="col-12 col-md-8">
          <input type="text" id="buscador" class="form-control" placeholder="Buscar por título o género...">
        </div>
        <div class="col-12 col-md-4">
          <select id="filtro-plataforma" class="form-select">
            <option value="">Todas las plataformas</option>
            <option value="PC">PC</option>
            <option value="Consola">Consola</option>
            <option value="Móvil">Móvil</option>
            <option value="Arcade">Arcade</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Contenedor del catálogo -->
    <div class="card">
      <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
        <h2 class="m-0">Títulos disponibles</h2>
        <span id="contador-juegos" class="small fw-bold text-info">0 juegos</span>
      </div>

      <div id="catalogo-videojuegos"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/index.js"></script>
</body>
</html>
